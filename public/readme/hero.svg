<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0f1535"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#22d3ee" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f472b6" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
  </g>
  <!-- 3D Isometric Card 1 - Analytics -->
  <g filter="url(#shadow)" transform="translate(60, 70)">
    <!-- Card face -->
    <path d="M0,30 L80,-10 L160,30 L160,130 L80,170 L0,130 Z" fill="#111833" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Card top -->
    <path d="M0,30 L80,-10 L160,30 L80,70 Z" fill="#162040" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Bar chart on face -->
    <rect x="30" y="75" width="16" height="45" rx="2" fill="url(#cyan)" opacity="0.8"/>
    <rect x="55" y="60" width="16" height="60" rx="2" fill="url(#cyan)" opacity="0.6"/>
    <rect x="80" y="50" width="16" height="70" rx="2" fill="url(#cyan)" opacity="0.9"/>
    <rect x="105" y="65" width="16" height="55" rx="2" fill="url(#cyan)" opacity="0.7"/>
    <!-- Trend line -->
    <polyline points="38,72 63,57 88,47 113,62" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <!-- Dots -->
    <circle cx="38" cy="72" r="3" fill="#22d3ee"/>
    <circle cx="63" cy="57" r="3" fill="#22d3ee"/>
    <circle cx="88" cy="47" r="3" fill="#22d3ee"/>
    <circle cx="113" cy="62" r="3" fill="#22d3ee"/>
  </g>
  <!-- 3D Isometric Card 2 - AI Robot -->
  <g filter="url(#shadow2)" transform="translate(260, 50)">
    <path d="M0,30 L80,-10 L160,30 L160,130 L80,170 L0,130 Z" fill="#111833" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M0,30 L80,-10 L160,30 L80,70 Z" fill="#1a1040" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Robot head -->
    <rect x="55" y="65" width="50" height="40" rx="8" fill="none" stroke="#f472b6" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="70" cy="82" r="5" fill="#f472b6"/>
    <circle cx="90" cy="82" r="5" fill="#f472b6"/>
    <!-- Inner eye -->
    <circle cx="70" cy="82" r="2" fill="#0a0e27"/>
    <circle cx="90" cy="82" r="2" fill="#0a0e27"/>
    <!-- Antenna -->
    <line x1="80" y1="65" x2="80" y2="52" stroke="#f472b6" stroke-width="2"/>
    <circle cx="80" cy="50" r="4" fill="#f472b6" opacity="0.8"/>
    <!-- Body -->
    <rect x="60" y="110" width="40" height="25" rx="4" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6"/>
    <!-- Circuit lines -->
    <line x1="70" y1="115" x2="70" y2="130" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
    <line x1="80" y1="115" x2="80" y2="130" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
    <line x1="90" y1="115" x2="90" y2="130" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- 3D Isometric Card 3 - Link/Chain -->
  <g filter="url(#shadow3)" transform="translate(460, 80)">
    <path d="M0,30 L80,-10 L160,30 L160,130 L80,170 L0,130 Z" fill="#111833" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M0,30 L80,-10 L160,30 L80,70 Z" fill="#18103a" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Chain link 1 -->
    <rect x="45" y="65" width="30" height="50" rx="15" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <!-- Chain link 2 (overlapping) -->
    <rect x="85" y="75" width="30" height="50" rx="15" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <!-- Connection line -->
    <line x1="75" y1="90" x2="85" y2="90" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
    <!-- Dollar signs -->
    <text x="58" y="98" font-family="monospace" font-size="14" fill="#a78bfa" text-anchor="middle" opacity="0.8">$</text>
    <text x="102" y="108" font-family="monospace" font-size="14" fill="#8b5cf6" text-anchor="middle" opacity="0.8">$</text>
  </g>
  <!-- Title text -->
  <text x="450" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle" filter="url(#glow)">
    <tspan fill="url(#cyan)">Ai</tspan><tspan fill="white">Affil</tspan>
  </text>
  <text x="450" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="3">YOUR AI AFFILIATE BUSINESS, READY TO RUN</text>
  <!-- Floating particles -->
  <circle cx="700" cy="60" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="750" cy="100" r="1.5" fill="#f472b6" opacity="0.3"/>
  <circle cx="820" cy="80" r="2.5" fill="#8b5cf6" opacity="0.35"/>
  <circle cx="780" cy="150" r="1.5" fill="#22d3ee" opacity="0.25"/>
  <circle cx="830" cy="200" r="2" fill="#f472b6" opacity="0.3"/>
  <circle cx="690" cy="180" r="1" fill="#a78bfa" opacity="0.4"/>
  <circle cx="50" cy="40" r="1.5" fill="#22d3ee" opacity="0.3"/>
  <circle cx="850" cy="260" r="2" fill="#22d3ee" opacity="0.2"/>
  <!-- Decorative lines -->
  <line x1="660" y1="60" x2="700" y2="60" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>
  <line x1="700" y1="100" x2="750" y2="100" stroke="#f472b6" stroke-width="1" opacity="0.15"/>
  <line x1="750" y1="140" x2="820" y2="140" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <!-- Border glow -->
  <rect width="900" height="320" rx="16" fill="none" stroke="url(#cyan)" stroke-width="1" stroke-opacity="0.2"/>
</svg>
