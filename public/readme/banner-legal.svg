<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="80" rx="12" fill="url(#bg)"/>
  <!-- 3D shield icon -->
  <g transform="translate(28, 8)" filter="url(#glow)">
    <!-- Shield shape -->
    <path d="M22,5 L40,12 L40,30 Q40,45 22,55 Q4,45 4,30 L4,12 Z" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="2"/>
    <!-- Checkmark -->
    <polyline points="14,28 20,36 32,20" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shine line -->
    <path d="M14,12 L22,8 L30,12" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  </g>
  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">Legal &amp; compliance</text>
  <line x1="370" y1="40" x2="870" y2="40" stroke="#10b981" stroke-width="1" opacity="0.15"/>
  <rect width="900" height="80" rx="12" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.1"/>
</svg>
