<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="80" rx="12" fill="url(#bg)"/>
  <!-- 3D layered blocks -->
  <g transform="translate(22, 8)" filter="url(#glow)">
    <!-- Bottom layer -->
    <path d="M5,45 L25,55 L45,45 L25,35 Z" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
    <!-- Middle layer -->
    <path d="M5,35 L25,45 L45,35 L25,25 Z" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Top layer -->
    <path d="M5,25 L25,35 L45,25 L25,15 Z" fill="#f472b6" opacity="0.3" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Vertical edges -->
    <line x1="5" y1="25" x2="5" y2="45" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <line x1="45" y1="25" x2="45" y2="45" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <line x1="25" y1="35" x2="25" y2="55" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <!-- Connection dots -->
    <circle cx="25" cy="15" r="2" fill="#f472b6"/>
    <circle cx="5" cy="35" r="1.5" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="45" cy="35" r="1.5" fill="#8b5cf6" opacity="0.7"/>
  </g>
  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">Architecture</text>
  <line x1="300" y1="40" x2="870" y2="40" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
  <rect width="900" height="80" rx="12" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.1"/>
</svg>
