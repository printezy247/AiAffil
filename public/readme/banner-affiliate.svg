<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="80" rx="12" fill="url(#bg)"/>
  <!-- 3D chain link icon -->
  <g transform="translate(25, 12)" filter="url(#glow)">
    <!-- Link 1 -->
    <rect x="5" y="8" width="20" height="35" rx="10" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Link 2 overlapping -->
    <rect x="25" y="14" width="20" height="35" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <!-- Dollar sparkle -->
    <text x="42" y="20" font-family="monospace" font-size="10" fill="#a78bfa" opacity="0.7">$</text>
    <circle cx="12" cy="6" r="1.5" fill="#8b5cf6" opacity="0.5"/>
  </g>
  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">Affiliate links</text>
  <line x1="310" y1="40" x2="870" y2="40" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <rect width="900" height="80" rx="12" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.1"/>
</svg>
