<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="80" rx="12" fill="url(#bg)"/>
  <!-- 3D chart/growth icon -->
  <g transform="translate(28, 10)" filter="url(#glow)">
    <!-- Isometric base -->
    <path d="M0,50 L22,40 L44,50 L22,60 Z" fill="#f472b6" opacity="0.15" stroke="#f472b6" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Rising bars -->
    <path d="M5,48 L5,40" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <path d="M14,46 L14,32" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <path d="M23,44 L23,25" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M32,46 L32,18" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M41,48 L41,10" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <!-- Trend arrow -->
    <polyline points="5,38 14,30 23,23 32,16 41,8" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.6"/>
    <polygon points="41,5 44,12 38,10" fill="#f472b6" opacity="0.7"/>
  </g>
  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">Business model</text>
  <line x1="320" y1="40" x2="870" y2="40" stroke="#f472b6" stroke-width="1" opacity="0.15"/>
  <rect width="900" height="80" rx="12" fill="none" stroke="#f472b6" stroke-width="1" stroke-opacity="0.1"/>
</svg>
