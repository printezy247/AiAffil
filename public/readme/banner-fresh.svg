<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="80" rx="12" fill="url(#bg)"/>
  <!-- 3D refresh/catalog icon -->
  <g transform="translate(25, 10)" filter="url(#glow)">
    <!-- Document stack -->
    <rect x="10" y="8" width="28" height="36" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <rect x="6" y="12" width="28" height="36" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
    <rect x="2" y="16" width="28" height="36" rx="3" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2"/>
    <!-- Lines on front doc -->
    <line x1="8" y1="24" x2="24" y2="24" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <line x1="8" y1="30" x2="20" y2="30" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <line x1="8" y1="36" x2="22" y2="36" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
    <!-- Refresh arrow -->
    <path d="M34,25 A10,10 0 1,1 34,35" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <polygon points="34,22 37,27 31,27" fill="#f59e0b" opacity="0.8"/>
  </g>
  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">Keep the catalog fresh</text>
  <line x1="400" y1="40" x2="870" y2="40" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>
  <rect width="900" height="80" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.1"/>
</svg>
