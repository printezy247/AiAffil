<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="80" rx="12" fill="url(#bg)"/>
  <!-- 3D cube icon -->
  <g transform="translate(30, 15)" filter="url(#glow)">
    <path d="M25,5 L45,15 L45,35 L25,45 L5,35 L5,15 Z" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M5,15 L25,25 L45,15" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <path d="M25,25 L25,45" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <!-- Grid dots on face -->
    <circle cx="15" cy="25" r="2" fill="#22d3ee" opacity="0.6"/>
    <circle cx="25" cy="30" r="2" fill="#22d3ee" opacity="0.8"/>
    <circle cx="35" cy="25" r="2" fill="#22d3ee" opacity="0.6"/>
    <circle cx="15" cy="35" r="2" fill="#22d3ee" opacity="0.4"/>
    <circle cx="35" cy="35" r="2" fill="#22d3ee" opacity="0.4"/>
  </g>
  <text x="100" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white">Features</text>
  <!-- Decorative line -->
  <line x1="230" y1="40" x2="870" y2="40" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>
  <rect width="900" height="80" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.1"/>
</svg>
